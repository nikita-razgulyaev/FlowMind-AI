# Локальный запуск: FlowMind AI + Ollama (локальные модели), без регистрации и лимитов.
#   docker compose up --build        →  http://localhost:8000
#
# Необязательный файл .env рядом с этим compose-файлом:
#   OLLAMA_MODEL=qwen2.5   PLATFORM_LLM_API_KEY=hf_...   GOOGLE_CLIENT_ID=...   GOOGLE_CLIENT_SECRET=...
services:
  app:
    build: .
    ports:
      - "127.0.0.1:8000:8000"       # только localhost: в локальном режиме нет авторизации — не публикуйте порт наружу
    environment:
      DEPLOYMENT_MODE: local
      DATABASE_URL: sqlite+aiosqlite:////data/flowmind.db
      SECRET_KEY: ${SECRET_KEY:-local-only-secret-change-if-you-share-the-volume}
      OLLAMA_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5}
      FRONTEND_URL: http://localhost:8000
      PLATFORM_LLM_API_KEY: ${PLATFORM_LLM_API_KEY:-}
      PLATFORM_LLM_MODEL: ${PLATFORM_LLM_MODEL:-openai/gpt-oss-120b:groq}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
    volumes:
      - flowmind-data:/data
    depends_on:
      - ollama
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama-models:/root/.ollama
    restart: unless-stopped
    # Для GPU NVIDIA раскомментируйте (нужен nvidia-container-toolkit):
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

  # Одноразовая загрузка модели при первом запуске (несколько ГБ — это нормально)
  ollama-pull:
    image: ollama/ollama:latest
    depends_on:
      - ollama
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["/bin/sh", "-c", "until ollama list >/dev/null 2>&1; do sleep 2; done; ollama pull ${OLLAMA_MODEL:-qwen2.5}"]
    restart: "no"

volumes:
  flowmind-data:
  ollama-models:
