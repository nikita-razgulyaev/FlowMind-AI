<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" font-family="Inter, Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
  <rect width="960" height="560" fill="#ffffff"/>
  <text x="40" y="44" font-size="20" font-weight="700" fill="#111827">FlowMind AI: варианты логотипа</text>
  <text x="40" y="66" font-size="12" fill="#6b7280">Знак читается в 16 px (вкладка браузера), одноцветная версия работает на любом фоне</text>

  <!-- карточки -->
  <g fill="#f9fafb" stroke="#e5e7eb">
    <rect x="40" y="90" width="270" height="200" rx="14"/>
    <rect x="345" y="90" width="270" height="200" rx="14"/>
    <rect x="650" y="90" width="270" height="200" rx="14"/>
    <rect x="40" y="320" width="270" height="200" rx="14"/>
    <rect x="345" y="320" width="270" height="200" rx="14"/>
    <rect x="650" y="320" width="270" height="200" rx="14"/>
  </g>

  <!-- 1. Ветвление: один вход, три результата (как схема на главной) -->
  <g transform="translate(70 130)">
    <rect width="64" height="64" rx="16" fill="#2563eb"/>
    <g stroke="#fff" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <path d="M16 32 H28"/>
      <path d="M28 32 C 36 32, 36 17, 46 17"/>
      <path d="M28 32 H46"/>
      <path d="M28 32 C 36 32, 36 47, 46 47"/>
    </g>
    <g fill="#fff"><circle cx="16" cy="32" r="4.2"/><circle cx="47" cy="17" r="4.2"/><circle cx="47" cy="32" r="4.2"/><circle cx="47" cy="47" r="4.2"/></g>
    <text x="80" y="38" font-size="24" font-weight="700" fill="#111827">Flow<tspan fill="#2563eb">Mind</tspan></text>
    <text x="80" y="60" font-size="13" font-weight="600" fill="#6366f1" letter-spacing="2">AI</text>
  </g>
  <text x="70" y="256" font-size="13" font-weight="600" fill="#111827">1. Ветвление</text>
  <text x="70" y="274" font-size="11" fill="#6b7280">Один вход, три результата: повторяет схему на лендинге</text>

  <!-- 2. Узлы и искра ИИ -->
  <g transform="translate(375 130)">
    <rect width="64" height="64" rx="32" fill="#eef2ff"/>
    <g stroke="#2563eb" stroke-width="3.4" stroke-linecap="round"><path d="M18 44 L34 36"/></g>
    <circle cx="17" cy="44" r="6.5" fill="#2563eb"/>
    <circle cx="35" cy="36" r="6.5" fill="#6366f1"/>
    <path d="M46 14 L49 22 L57 25 L49 28 L46 36 L43 28 L35 25 L43 22 Z" fill="#6366f1"/>
    <text x="80" y="38" font-size="24" font-weight="700" fill="#111827">Flow<tspan fill="#2563eb">Mind</tspan></text>
    <text x="80" y="60" font-size="13" font-weight="600" fill="#6366f1" letter-spacing="2">AI</text>
  </g>
  <text x="375" y="256" font-size="13" font-weight="600" fill="#111827">2. Узлы и искра</text>
  <text x="375" y="274" font-size="11" fill="#6b7280">Два связанных шага и «искра» ИИ, мягкий и дружелюбный</text>

  <!-- 3. Буква F из схемы -->
  <g transform="translate(680 130)">
    <rect width="64" height="64" rx="16" fill="#111827"/>
    <g stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <path d="M22 50 V18 H46"/>
      <path d="M22 33 H38"/>
    </g>
    <circle cx="22" cy="50" r="4.6" fill="#60a5fa"/>
    <circle cx="47" cy="18" r="4.6" fill="#60a5fa"/>
    <circle cx="39" cy="33" r="4.6" fill="#60a5fa"/>
    <text x="80" y="38" font-size="24" font-weight="700" fill="#111827">Flow<tspan fill="#2563eb">Mind</tspan></text>
    <text x="80" y="60" font-size="13" font-weight="600" fill="#6366f1" letter-spacing="2">AI</text>
  </g>
  <text x="680" y="256" font-size="13" font-weight="600" fill="#111827">3. Буква F</text>
  <text x="680" y="274" font-size="11" fill="#6b7280">F, собранная из шагов и связей: строгий, технологичный знак</text>

  <!-- 4. Буква M из узлов -->
  <g transform="translate(70 360)">
    <rect width="64" height="64" rx="16" fill="#f3f4f6"/>
    <g stroke="#2563eb" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round" fill="none"><path d="M14 48 V18 L32 38 L50 18 V48"/></g>
    <g fill="#6366f1"><circle cx="14" cy="18" r="4.6"/><circle cx="32" cy="38" r="4.6"/><circle cx="50" cy="18" r="4.6"/></g>
    <text x="80" y="38" font-size="24" font-weight="700" fill="#111827">Flow<tspan fill="#2563eb">Mind</tspan></text>
    <text x="80" y="60" font-size="13" font-weight="600" fill="#6366f1" letter-spacing="2">AI</text>
  </g>
  <text x="70" y="486" font-size="13" font-weight="600" fill="#111827">4. Буква M</text>
  <text x="70" y="504" font-size="11" fill="#6b7280">M, нарисованная как граф: узлы на вершинах</text>

  <!-- 5. Поток: волна через три точки -->
  <g transform="translate(375 360)">
    <circle cx="32" cy="32" r="32" fill="#2563eb"/>
    <path d="M12 38 C 20 20, 26 20, 32 32 S 44 44, 52 26" stroke="#fff" stroke-width="3.6" stroke-linecap="round" fill="none"/>
    <g fill="#fff"><circle cx="12" cy="38" r="3.8"/><circle cx="32" cy="32" r="3.8"/><circle cx="52" cy="26" r="3.8"/></g>
    <text x="80" y="38" font-size="24" font-weight="700" fill="#111827">Flow<tspan fill="#2563eb">Mind</tspan></text>
    <text x="80" y="60" font-size="13" font-weight="600" fill="#6366f1" letter-spacing="2">AI</text>
  </g>
  <text x="375" y="486" font-size="13" font-weight="600" fill="#111827">5. Поток</text>
  <text x="375" y="504" font-size="11" fill="#6b7280">Плавная линия потока через три шага, самый нейтральный</text>

  <!-- 6. Диалог + шаги: помощник собирает сценарий -->
  <g transform="translate(680 360)">
    <path d="M8 12 a10 10 0 0 1 10-10 h28 a10 10 0 0 1 10 10 v24 a10 10 0 0 1 -10 10 h-18 l-12 12 v-12 h0 a10 10 0 0 1 -8 -10 z" fill="#6366f1" transform="translate(0 4)"/>
    <g stroke="#fff" stroke-width="3" stroke-linecap="round"><path d="M20 28 H44"/></g>
    <g fill="#fff"><circle cx="20" cy="28" r="4"/><circle cx="32" cy="28" r="4"/><circle cx="44" cy="28" r="4"/></g>
    <text x="80" y="38" font-size="24" font-weight="700" fill="#111827">Flow<tspan fill="#2563eb">Mind</tspan></text>
    <text x="80" y="60" font-size="13" font-weight="600" fill="#6366f1" letter-spacing="2">AI</text>
  </g>
  <text x="680" y="486" font-size="13" font-weight="600" fill="#111827">6. Диалог и шаги</text>
  <text x="680" y="504" font-size="11" fill="#6b7280">Реплика ИИ-помощника, внутри цепочка шагов: про «опишите словами»</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
