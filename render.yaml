# Render Blueprint: один Docker-сервис (API + сайт) и PostgreSQL.
# Подключение: Render → New → Blueprint → выберите репозиторий.
# Значения с sync: false Render спросит при создании.
databases:
  - name: flowmind-db
    databaseName: flowmind
    user: flowmind
    plan: free            # у бесплатной БД ограниченный срок жизни — для постоянной работы возьмите платный план

services:
  - type: web
    name: flowmind-ai
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free            # бесплатный сервис засыпает после простоя; перед презентацией «разбудите» его
    healthCheckPath: /api/health
    envVars:
      - key: DEPLOYMENT_MODE
        value: cloud
      - key: DATABASE_URL
        fromDatabase:
          name: flowmind-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ENCRYPTION_KEY
        generateValue: true
      - key: PAYMENT_PROVIDER
        value: mock
      - key: DEMO_MODE
        value: "true"      # для презентации; выключите, когда придут реальные пользователи
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: PLATFORM_LLM_API_KEY
        sync: false
      - key: PLATFORM_LLM_MODEL
        value: openai/gpt-oss-120b:groq
