# Продакшен на своём сервере: FlowMind AI (cloud) + PostgreSQL + Caddy (автоматический HTTPS).
#   cp .env.prod.example .env.prod   # заполните значения
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build
services:
  app:
    build: .
    env_file: .env.prod
    environment:
      DEPLOYMENT_MODE: cloud
      DATABASE_URL: postgresql://flowmind:${POSTGRES_PASSWORD}@db:5432/flowmind
      PUBLIC_BASE_URL: https://${DOMAIN}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    # порт наружу не публикуется — трафик идёт через Caddy

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: flowmind
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: flowmind
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flowmind -d flowmind"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - app
    restart: unless-stopped

volumes:
  pgdata:
  caddy-data:
  caddy-config:
